    title: Promo lift vs baseline
    summary: Active campaign plus forecast overrides and a demand-side market signal.
    kpis: [MAPE, Promo Lift]
    steps:
      - id: bind-campaign
        title: Bind an active campaign
        plugin: sfdc
        tables: [Campaign]
