[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexus-simulator"
version = "0.1.0a1"
description = "Pluggable simulator library extracted from nexus-backend. Port-based core with a SimulatorRegistry plugin model (WXCC, SFDC, Oracle ERP, SAP, External Source), DynamoDB/S3/Redis default adapters, a reference FastAPI/MCP server, and an importable testing harness."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Nexus Simulator Team" },
]
keywords = ["simulator", "wxcc", "sfdc", "oracle-erp", "sap", "fdw", "mcp", "nexus"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pydantic>=2.10",
    "loguru>=0.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
aws = [
    "boto3>=1.38",
    "botocore>=1.38",
]
redis = [
    "redis>=5.0",
]
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.35",
    "httpx>=0.28",
    "fastmcp>=2.12",
    "python-multipart>=0.0.9",
]
harness = [
    "nexus-simulator[server]",
    "behave>=1.3",
    "behave-html-formatter>=0.9",
    "pytest-benchmark>=4.0",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "pytest-randomly>=3.15",
    "pytest-mock>=3.14",
    "moto>=5.0",
    "fakeredis>=2.20",
    "hypothesis>=6.100",
    "freezegun>=1.5",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "pytest-randomly>=3.15",
    "pytest-mock>=3.14",
    "moto>=5.0",
    "fakeredis>=2.20",
    "hypothesis>=6.100",
    "freezegun>=1.5",
    "pytest-watch>=4.2",
    "ruff>=0.6",
    "mypy>=1.10",
    "build>=1.2",
    "twine>=5.0",
    "tomli>=2.0; python_version<'3.11'",
]

[project.scripts]
nexus-simulator = "nexus_simulator.server.cli:main"

[project.entry-points.pytest11]
nexus_simulator = "nexus_simulator.testing.fixtures"

[project.urls]
Homepage = "https://github.com/nexusdataai/nexus-simulator"
Repository = "https://github.com/nexusdataai/nexus-simulator"
Issues = "https://github.com/nexusdataai/nexus-simulator/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_simulator"]

[tool.hatch.build.targets.sdist]
include = [
    "src/nexus_simulator",
    "tests",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
markers = [
    "heavy: long-running endurance scenarios skipped by default",
    "integration: requires moto-backed AWS mocks",
    "e2e: runs against in-process FastAPI harness",
    "bdd: behave-driven scenarios",
]

[tool.coverage.run]
source = ["src/nexus_simulator"]
omit = ["*/tests/*"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]
# FastAPI uses calls like File(...), Query(...), Depends(...), Header(...) as
# parameter defaults by design; B008 is wrong for these files.
"src/nexus_simulator/server/routers/*.py" = ["B008"]

[tool.mypy]
python_version = "3.10"
strict_optional = true
warn_unused_ignores = true
warn_return_any = false
check_untyped_defs = true
exclude = ["tests/", "build/", "dist/"]
