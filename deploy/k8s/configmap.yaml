apiVersion: v1
kind: ConfigMap
metadata:
  name: nexus-simulator-config
  namespace: nexus-simulator
  labels:
    app.kubernetes.io/name: nexus-simulator
data:
  # Non-secret SimulatorConfig inputs. Secrets (Bearer tokens, role ARN
  # overrides, etc.) belong in a separate Secret and should be referenced via
  # `envFrom.secretRef` in the Deployment.
  #
  # ${ENV} placeholder is sed-substituted at apply time by deploy-and-test.sh.
  AWS_REGION: "${REGION}"
  ENVIRONMENT: "${ENV}"
  LOG_LEVEL: "INFO"
  API_HOST: "0.0.0.0"
  API_PORT: "8000"

  # Per-plugin S3 buckets follow the convention: simulator-<plugin>-${ENV}
  WXCC_SIMULATOR_BUCKET: "simulator-wxcc-${ENV}"
  WXCC_SIMULATOR_PREFIX: "wxcc-simulator"
  WXCC_SIM_ORG_ID: "sim-org-001"

  SFDC_SIMULATOR_BUCKET: "simulator-sfdc-${ENV}"
  SFDC_SIMULATOR_PREFIX: "sfdc-simulator"

  ORACLE_ERP_SIMULATOR_BUCKET: "simulator-oracle-erp-${ENV}"
  ORACLE_ERP_SIMULATOR_PREFIX: "oracle-erp-simulator"

  SAP_SIMULATOR_BUCKET: "simulator-sap-${ENV}"
  SAP_SIMULATOR_PREFIX: "sap-simulator"

  EXTERNAL_SIMULATOR_BUCKET: "simulator-external-${ENV}"
  EXTERNAL_SIMULATOR_PREFIX: "external-simulator"
