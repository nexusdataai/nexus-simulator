apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-simulator
  namespace: nexus-simulator
  labels:
    app.kubernetes.io/name: nexus-simulator
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: nexus
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: nexus-simulator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexus-simulator
        app.kubernetes.io/component: server
    spec:
      serviceAccountName: simulator-role-sa
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: nexus-simulator
      containers:
        - name: server
          # Image reference is patched at apply time by deploy-and-test.sh.
          # Production deploys use ${ECR_REGISTRY}/nexus-simulator:<tag>;
          # in-pod test runs use ${ECR_REGISTRY}/nexus-simulator:<tag>-test.
          image: REPLACE_WITH_ECR_REGISTRY/nexus-simulator:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: nexus-simulator-config
            # Uncomment once a Secret named nexus-simulator-secrets exists:
            # - secretRef:
            #     name: nexus-simulator-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: reports
              mountPath: /app/reports
      volumes:
        - name: tmp
          emptyDir: {}
        - name: reports
          emptyDir: {}
